<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Obsidian Matte Black Base Gradient -->
    <linearGradient id="obsidianBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040406" />
      <stop offset="35%" stop-color="#0B0C10" />
      <stop offset="70%" stop-color="#11131A" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>

    <!-- Brushed Metallic Liquid Gold Gradient -->
    <linearGradient id="metallicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="22%" stop-color="#E6C35C" />
      <stop offset="48%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#9A7418" />
      <stop offset="92%" stop-color="#F3D87D" />
      <stop offset="100%" stop-color="#6B4E0B" />
    </linearGradient>

    <!-- Secondary Warm Champagne Gold Gradient -->
    <linearGradient id="champagneGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#D4AF37" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#8A6412" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2A1F06" stop-opacity="0.2" />
    </linearGradient>

    <!-- 3D Dark Polygon Facet Gradients -->
    <linearGradient id="darkFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D26" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>
    <linearGradient id="darkFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14161D" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Ambient Golden Radial Glow -->
    <radialGradient id="goldAuraCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.24" />
      <stop offset="50%" stop-color="#9A7418" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldAuraTopRight" cx="82%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#FFEFA6" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#D4AF37" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldAuraBottomLeft" cx="18%" cy="85%" r="48%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.26" />
      <stop offset="55%" stop-color="#7A5911" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Obsidian Canvas -->
  <rect width="1920" height="1080" fill="url(#obsidianBase)" />

  <!-- Ambient Luxury Gold Lighting -->
  <rect width="1920" height="1080" fill="url(#goldAuraCenter)" />
  <rect width="1920" height="1080" fill="url(#goldAuraTopRight)" />
  <rect width="1920" height="1080" fill="url(#goldAuraBottomLeft)" />

  <!-- 3D Black & Gold Architectural Relief Facets (Left & Right Framing) -->
  <g stroke="url(#metallicGold)" stroke-width="1.6" opacity="0.92">
    <polygon points="0,0 460,0 310,320 0,240" fill="url(#darkFacet1)" />
    <polygon points="460,0 820,0 610,270 310,320" fill="url(#darkFacet2)" />
    <polygon points="0,240 310,320 220,660 0,590" fill="url(#darkFacet2)" />
    <polygon points="310,320 610,270 490,620 220,660" fill="url(#darkFacet1)" />
    <polygon points="0,590 220,660 390,1080 0,1080" fill="url(#darkFacet1)" />
    <polygon points="220,660 490,620 710,1080 390,1080" fill="url(#darkFacet2)" />

    <polygon points="1420,0 1920,0 1920,310 1580,260" fill="url(#darkFacet1)" />
    <polygon points="1120,0 1420,0 1580,260 1290,340" fill="url(#darkFacet2)" />
    <polygon points="1580,260 1920,310 1920,710 1640,640" fill="url(#darkFacet2)" />
    <polygon points="1290,340 1580,260 1640,640 1350,690" fill="url(#darkFacet1)" />
    <polygon points="1640,640 1920,710 1920,1080 1510,1080" fill="url(#darkFacet1)" />
    <polygon points="1350,690 1640,640 1510,1080 1190,1080" fill="url(#darkFacet2)" />
  </g>

  <!-- Flowing Kintsugi Liquid Gold Marble Veins -->
  <g fill="none" stroke="url(#metallicGold)" filter="url(#goldGlow)">
    <path d="M -40,860 C 280,790 440,520 760,540 C 1080,560 1240,290 1590,210 C 1740,175 1850,95 1960,40" stroke-width="4.5" opacity="0.95" />
    <path d="M -20,910 C 310,835 490,585 810,595 C 1130,605 1310,340 1640,245 C 1790,200 1880,140 1960,95" stroke-width="1.8" opacity="0.75" />
    <path d="M 120,-20 C 340,190 520,260 790,410 C 1060,560 1310,740 1760,1100" stroke-width="2.6" opacity="0.65" />
    <path d="M 640,-20 C 740,220 920,380 1180,490 C 1440,600 1690,630 1950,820" stroke-width="2.2" opacity="0.7" />
    <path d="M -30,380 C 240,420 510,690 880,780 C 1250,870 1540,790 1950,960" stroke-width="3.2" opacity="0.8" />
  </g>

  <!-- Luxury Golden Concentric Art-Deco Arches & Geometric Halo -->
  <g fill="none" stroke="url(#champagneGold)" opacity="0.55">
    <circle cx="960" cy="540" r="440" stroke-width="1.5" stroke-dasharray="12 8" />
    <circle cx="960" cy="540" r="390" stroke-width="2.2" />
    <circle cx="960" cy="540" r="310" stroke-width="1" />
    <polygon points="960,65 1435,540 960,1015 485,540" stroke-width="1.8" />
    <rect x="610" y="190" width="700" height="700" transform="rotate(45 960 540)" stroke-width="1.2" />
  </g>

  <!-- Metallic Gold Leaf & Corner Filigree Highlights -->
  <g fill="url(#metallicGold)" opacity="0.88">
    <polygon points="0,0 190,0 0,190" opacity="0.35" />
    <polygon points="0,0 95,0 0,95" opacity="0.75" />
    <polygon points="1920,0 1730,0 1920,190" opacity="0.35" />
    <polygon points="1920,0 1825,0 1920,95" opacity="0.75" />
    <polygon points="0,1080 190,1080 0,890" opacity="0.35" />
    <polygon points="0,1080 95,1080 0,985" opacity="0.75" />
    <polygon points="1920,1080 1730,1080 1920,890" opacity="0.35" />
    <polygon points="1920,1080 1825,1080 1920,985" opacity="0.75" />
  </g>

  <!-- Shimmering Gold Dust & Bokeh Particles -->
  <g fill="#FFEFA6" filter="url(#goldGlow)">
    <circle cx="180" cy="180" r="4" opacity="0.85" />
    <circle cx="260" cy="140" r="2.5" opacity="0.6" />
    <circle cx="340" cy="280" r="5" opacity="0.7" />
    <circle cx="150" cy="480" r="3.5" opacity="0.75" />
    <circle cx="290" cy="780" r="6" opacity="0.65" />
    <circle cx="440" cy="860" r="3" opacity="0.8" />
    <circle cx="620" cy="160" r="4.5" opacity="0.7" />
    <circle cx="780" cy="920" r="3.5" opacity="0.75" />
    <circle cx="1180" cy="150" r="5" opacity="0.8" />
    <circle cx="1340" cy="220" r="3" opacity="0.65" />
    <circle cx="1520" cy="180" r="6.5" opacity="0.85" />
    <circle cx="1710" cy="290" r="4" opacity="0.75" />
    <circle cx="1780" cy="490" r="5.5" opacity="0.7" />
    <circle cx="1620" cy="790" r="4.5" opacity="0.8" />
    <circle cx="1440" cy="890" r="3.5" opacity="0.65" />
    <circle cx="1740" cy="910" r="6" opacity="0.8" />
    <circle cx="520" cy="460" r="2.5" opacity="0.55" />
    <circle cx="1410" cy="440" r="3" opacity="0.6" />
  </g>
</svg>
